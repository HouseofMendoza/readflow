<script>
(()=>{
const st=document.createElement('style');
st.textContent='.fx{position:fixed;inset:0;z-index:9999;background:#000;pointer-events:none}.fx.grow{animation:fxg .75s cubic-bezier(.7,0,.2,1) forwards}@keyframes fxg{from{clip-path:circle(0 at var(--x) var(--y))}to{clip-path:circle(150% at var(--x) var(--y))}}.fx.back{animation:fxb .8s ease forwards}@keyframes fxb{to{opacity:0;visibility:hidden}}';
document.head.appendChild(st);
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* coming back from ReadFlow: fade in from black */
try{
  if(sessionStorage.getItem('hom-back')){
    sessionStorage.removeItem('hom-back');
    if(!rm){const f=document.createElement('div');f.className='fx back';document.body.appendChild(f);setTimeout(()=>f.remove(),900)}
  }
}catch(e){}

/* going to ReadFlow: black circle grows from the click */
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href*="readflow"]');
  if(!a||e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;
  e.preventDefault();
  try{sessionStorage.setItem('hom-t','1')}catch(_){}
  if(rm){location.href=a.href;return}
  const f=document.createElement('div');
  f.className='fx grow';
  f.style.setProperty('--x',e.clientX+'px');
  f.style.setProperty('--y',e.clientY+'px');
  document.body.appendChild(f);
  setTimeout(()=>{location.href=a.href},760);
});

addEventListener('pageshow',e=>{if(e.persisted)document.querySelectorAll('.fx').forEach(x=>x.remove())});
})();
</script>
